<title id="title">Three sources of repayment</title><desc id="desc">Three schematic paths represent contracted cash flows, a bridge to a defined next step, and equity participation in future upside.</desc>
<style>.ink{stroke:#242427;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#533afe;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.muted{stroke:#9e9ca5;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="800" height="600" fill="#f6f6f5"/>

<g class="muted"><path d="M150 160H650M150 300H650M150 440H390"/></g>
<path d="M230 160H570" class="accent"/>
<path d="M230 300H385" stroke="#533afe" stroke-width="3" fill="none"/><path d="M385 300H490" stroke="#533afe" stroke-width="3" stroke-dasharray="7 8" fill="none"/><path d="M490 300H570" class="ink"/>
<path d="M230 440H390C470 440 480 386 570 386M390 440H570M390 440C470 440 480 494 570 494" class="accent"/>

<g fill="#f6f6f5" stroke="#533afe" stroke-width="2.5"><rect x="310" y="140" width="40" height="40"/><rect x="470" y="280" width="40" height="40"/><circle cx="581" cy="386" r="11"/><circle cx="581" cy="440" r="11"/><circle cx="581" cy="494" r="11"/></g>

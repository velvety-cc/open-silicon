<section class="sheet v3 structure-v3" id="deck-page-7" aria-label="Slide 7 of 14" data-page="7"><main><header class="page-heading"><div class="eyebrow">04 · Transaction structure</div><h1>Project Aurora Entity Structure</h1><p class="subtitle">Planned Funding, GPU Ownership, Operations, and Entity Structure for Project Aurora.</p></header><div class="body"><figure class="aurora-deal-structure"><svg class="aurora-deal-diagram" viewbox="0 0 1168 444" role="img" aria-label="Project Aurora proposed funding, GPU delivery, compute services and assigned customer receipts"><title>Project Aurora proposed transaction structure</title><desc>Six parties in two aligned rows. Investors provide capital to AI Infra Access Fund and receive net distributions. The Fund lends to the proposed Project SPV and receives principal and interest. The SPV is the proposed borrower and GPU owner, and pays the GPU supplier. The supplier delivers equipment to the operator at the energized Texas site. The SPV grants GPU operating rights to the operator. The operator supplies compute services to the customer, who is the offtaker. Assigned customer receipts support SPV debt service. Collection and security arrangements remain proposed and subject to final documentation.</desc><defs><marker id="aurora-funding-arrow" viewbox="0 0 8 8" refx="8" refy="4" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#17191b"></path></marker><marker id="aurora-repayment-arrow" viewbox="0 0 8 8" refx="8" refy="4" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="var(--brand-accent)"></path></marker><marker id="aurora-rights-arrow" viewbox="0 0 8 8" refx="8" refy="4" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#9a9ca5"></path></marker></defs><g class="aurora-deal-connections"><path data-flow="capital" class="deal-flow deal-flow-funding" d="M248 48H444" marker-end="url(#aurora-funding-arrow)">

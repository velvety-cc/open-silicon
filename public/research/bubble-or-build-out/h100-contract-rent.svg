<svg xmlns="http://www.w3.org/2000/svg" width="720" height="302" viewBox="0 0 600 252" role="img" aria-labelledby="title desc">
<title id="title">H100 one-year contract rents, 2023 to April 2026</title>
<desc id="desc">One-year H100 contract rents fell from $2.70–3.40 per GPU-hour in the first half of 2023 to $1.45–1.95 in October 2025, then recovered to $2.10–2.70 in April 2026.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="574" viewBox="0 0 600 478" role="img" aria-labelledby="title desc">
<title id="title">H100 pricing observations and hypothetical payback</title>
<desc id="desc">SemiAnalysis reported on April 2, 2026 that one-year H100 contract pricing was $1.70 per GPU-hour in October 2025 and $2.35 in March 2026. With a hypothetical $35,000 installed budget, 90% paid occupancy and $400 monthly cash costs, modeled payback is 48.8 and 30.6 months respectively. These are two observations, not a continuous series or percentile ranges.</desc>
<style>text { font-family: Geist, -apple-system, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }</style>
<rect width="600" height="478" fill="#fff"/>
<text x="0" y="20" font-size="15" font-weight="600" fill="#111">H100 one-year contract pricing</text>
<text x="0" y="43" font-size="13" fill="#555">Two observations disclosed April 2, 2026 · $ per GPU-hour</text>
<text x="0" y="250" font-size="15" font-weight="600" fill="#111">Modeled payback</text>
<text x="0" y="273" font-size="13" fill="#555">Hypothetical $35,000 budget · 90% occupancy · $400/month costs</text>
<text x="0" y="94" font-size="14" fill="#555">Oct 2025</text>
<rect x="104" y="70" width="430" height="36" fill="#f3f3f3"/>
<rect x="104" y="70" width="243.67" height="36" fill="#533afe" fill-opacity=".12"/>
<line x1="104" y1="106" x2="347.67" y2="106" stroke="#533afe" stroke-width="2"/>
<text x="357.67" y="94" font-size="14" font-weight="500" fill="#111">$1.70</text>
<text x="0" y="158" font-size="14" fill="#555">Mar 2026</text>
<rect x="104" y="134" width="430" height="36" fill="#f3f3f3"/>
<rect x="104" y="134" width="336.83" height="36" fill="#533afe" fill-opacity=".12"/>
<line x1="104" y1="170" x2="440.83" y2="170" stroke="#533afe" stroke-width="2"/>
<text x="450.83" y="158" font-size="14" font-weight="500" fill="#111">$2.35</text>
<text x="0" y="324" font-size="14" fill="#555">Oct 2025</text>
<rect x="104" y="300" width="430" height="36" fill="#f3f3f3"/>
<rect x="104" y="300" width="349.89" height="36" fill="#111" fill-opacity=".12"/>
<line x1="104" y1="336" x2="453.89" y2="336" stroke="#111" stroke-width="2"/>
<text x="463.89" y="324" font-size="14" font-weight="500" fill="#111">48.8 months</text>
<text x="0" y="388" font-size="14" fill="#555">Mar 2026</text>
<rect x="104" y="364" width="430" height="36" fill="#f3f3f3"/>
<rect x="104" y="364" width="219.27" height="36" fill="#111" fill-opacity=".12"/>
<line x1="104" y1="400" x2="323.27" y2="400" stroke="#111" stroke-width="2"/>
<text x="333.27" y="388" font-size="14" font-weight="500" fill="#111">30.6 months</text>
<text x="0" y="451" font-size="13" fill="#555">Cost and occupancy are assumptions, not historical equipment quotes.</text>
</svg>

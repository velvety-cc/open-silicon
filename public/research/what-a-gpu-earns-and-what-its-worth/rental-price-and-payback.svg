<svg xmlns="http://www.w3.org/2000/svg" width="720" height="574" viewBox="0 0 600 478" role="img" aria-labelledby="title desc">
<title id="title">H100 contract rents and modeled payback, 2023 to April 2026</title>
<desc id="desc">One-year H100 contract rents fell from $2.70–3.40 per GPU-hour in the first half of 2023 to $1.45–1.95 in October 2025, then recovered to $2.10–2.70 in April 2026. Holding cost, occupancy and operating costs constant, modeled payback rose from 19.5–26.0 months to 40.6–64.7 months, then fell to 26.0–36.5 months.</desc>
